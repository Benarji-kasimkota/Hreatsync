<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#080202" />
  <title>HeartSync — Sign In</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="login.css" />
  <!-- Apple Sign In JS SDK — works when a Service ID is configured in Apple Developer -->
  <script src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js" async></script>
</head>
<body>

<div class="login-app">

  <!-- Brand -->
  <div class="login-brand">
    <div class="brand-heart" id="brand-heart">♥</div>
    <div class="brand-name">HEARTSYNC</div>
    <div class="brand-tagline">Your cardiac rhythm. Personalized.</div>
  </div>

  <!-- Auth card -->
  <div class="login-card">

    <!-- Apple Sign In -->
    <button class="apple-btn" id="apple-btn" type="button">
      <svg class="apple-logo" viewBox="0 0 814 1000" xmlns="http://www.w3.org/2000/svg">
        <path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76 0-103.7 40.8-165.9 40.8s-105-43.1-150.1-90.2c-48.3-50.7-87.7-122.3-87.7-190.5 0-140.9 91.9-216.7 181.7-216.7 49.6 0 90.9 32.5 121.9 32.5 29.5 0 75.8-34.5 132-34.5zm-337.3-235.9c28.3-33.7 48.4-81.1 48.4-128.7 0-6.4-.6-12.8-1.9-18.6-45.6 1.9-98.2 30.5-131.2 68.3-25.1 28.3-47.8 75.2-47.8 123.5 0 7.1 1.3 14.2 1.9 16.5 2.6.6 6.5 1.3 10.4 1.3 40.8 0 91.9-27.3 120.2-62.3z"/>
      </svg>
      <span id="apple-btn-text">Continue with Apple</span>
    </button>

    <div class="divider"><span>or</span></div>

    <!-- Email / Password form -->
    <form id="auth-form" novalidate autocomplete="on">
      <div class="form-row" id="name-row" style="display:none">
        <input type="text" id="form-name" placeholder="Full Name" autocomplete="name" />
      </div>
      <div class="form-row">
        <input type="email" id="form-email" placeholder="Email" autocomplete="email" inputmode="email" />
      </div>
      <div class="form-row">
        <input type="password" id="form-pass" placeholder="Password" autocomplete="current-password" minlength="6" />
      </div>
      <div class="form-error" id="form-error" role="alert"></div>
      <button type="submit" class="submit-btn" id="submit-btn">SIGN IN</button>
    </form>

    <button class="mode-switch" id="mode-switch" type="button">
      No account? <span>Create one →</span>
    </button>

  </div><!-- /login-card -->

  <div class="privacy-note">
    <span>🔒</span> Your heart data never leaves this device
  </div>

  <div class="demo-notice" id="demo-notice">
    Running in demo mode — Apple Sign In requires a configured Service ID
  </div>

</div><!-- /login-app -->

<script src="auth.js"></script>
<script src="login.js"></script>
</body>
</html>
